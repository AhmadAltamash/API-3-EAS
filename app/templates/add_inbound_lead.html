{% extends "base.html" %}

{% block content %}

<div class="fade-up">

    <div class="hero-banner d-flex justify-content-between align-items-center">

        <div>

            <div class="hero-eyebrow">

                <i class="fa-solid fa-inbox"></i>

                Inbound Lead

            </div>

            <h2>

                Add Inbound Lead

            </h2>

            <p>

                For a company that reached out to us directly rather than
                one found through search — it'll flow through the same
                pipeline from here on.

            </p>

        </div>

    </div>

    <a href="{{ url_for('buyers.buyers') }}" class="btn btn-outline-secondary btn-sm mb-4">

        <i class="fa-solid fa-arrow-left me-1"></i>

        Back to Buyer Database

    </a>

    <div class="card">

        <div class="card-body">

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">Company Name *</label>

                        <input type="text" class="form-control" name="company" required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Contact Name</label>

                        <input type="text" class="form-control" name="buyer_name">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Email</label>

                        <input type="email" class="form-control" name="email">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Website</label>

                        <input type="url" class="form-control" name="website" placeholder="https://">

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">Country</label>

                        <select class="form-select" name="country">

                            <option value="">-- Unknown --</option>
                            <option value="United States">United States</option>
                            <option value="Canada">Canada</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">State / Province</label>

                        <input type="text" class="form-control" name="state" placeholder="e.g. TX, ON">

                    </div>

                    <div class="col-12">

                        <label class="form-label">Note (optional)</label>

                        <textarea class="form-control" name="note" rows="3"
                            placeholder="How did they reach out? What are they interested in?"></textarea>

                    </div>

                </div>

                <button type="submit" class="btn btn-primary mt-4">

                    <i class="fa-solid fa-plus me-2"></i>

                    Add to Pipeline

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
